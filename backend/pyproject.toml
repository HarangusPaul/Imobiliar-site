[project]
name = "imobiliar-backend"
version = "0.1.0"
description = "Real-estate platform backend (Django modular monolith)."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "django-filter>=24.1",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["core", "apps", "services", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"utils".msg = "No generic dumping grounds. Give the code a named owner module."

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# Architecture boundaries are enforced mechanically, not by convention alone.
[tool.importlinter]
root_packages = ["core", "apps", "services", "config"]

[[tool.importlinter.contracts]]
name = "core is domain-neutral and depends on nothing in the project"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["apps", "services", "config"]

[[tool.importlinter.contracts]]
name = "apps never import concrete provider adapters"
type = "forbidden"
source_modules = ["apps"]
forbidden_modules = ["services"]

[[tool.importlinter.contracts]]
name = "services never import business domains"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["apps", "config"]
